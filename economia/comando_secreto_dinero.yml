# Comando secreto "/bonuscash" que da $1000 vía Vault (requiere plugin de economía).
comando_secreto_dinero:
  type: player_command
  conditions:
  - '%main_command% equalsIgnoreCase /bonuscash'
  actions:
    default:
    - 'cancel_event: true'
    - 'console_command: eco give %player% 1000'
    - "message: &a¡Código canjeado! &7Recibes &a$1000&7."
    - 'firework: colors:YELLOW,GOLD type:BALL fade:WHITE power:0'
