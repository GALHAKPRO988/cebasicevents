# Comando secreto "/regalodiamante" que da 5 diamantes al jugador.
# Cambia el nombre del comando y la cantidad a tu gusto.
comando_secreto_diamantes:
  type: player_command
  conditions:
  - '%main_command% equalsIgnoreCase /regalodiamante'
  actions:
    default:
    - 'cancel_event: true'
    - 'give_item: id:DIAMOND;amount:5'
    - 'message: &b¡Has encontrado un código secreto! &7Recibes &b5 diamantes&7.'
    - 'playsound: ENTITY_PLAYER_LEVELUP;10;2'
